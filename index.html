<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kişisel Muhasebecim — Gelir ve Gider Takip Programı</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 1.5rem 2.5rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 620px;
      margin: 0 auto 2rem;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.9rem 1.8rem;
      border-radius: 0.65rem;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-download:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .meta {
      margin-top: 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.5rem 4rem;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1.4rem;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <span class="badge">Sürüm 2.0.0 • Windows Kurulumu</span>
    <h1>Kişisel Muhasebecim</h1>
    <p class="subtitle">
      Kişisel muhasebe ve gelir-gider takip programı. Bütçenizi kolayca düzenleyin,
      harcamalarınızı tek yerden takip edin.
    </p>

      id="download-btn"
      class="btn-download"
      href="
